name: Build Linux AppImage

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag (e.g. windows/3.46.5382); empty = latest'
        required: false
        type: string
      electron:
        description: 'Electron version policy'
        required: false
        default: supported
        type: choice
        options: [supported, latest, upstream]
      builder:
        description: 'electron-builder version policy'
        required: false
        default: latest
        type: choice
        options: [latest, upstream]
      force:
        description: 'Force a rebuild as a new revision'
        required: false
        default: false
        type: boolean
      runner:
        description: 'Build runner (ubuntu-latest for a canary run)'
        required: false
        # Keep in sync with PINNED in runner-freshness.yml.
        default: ubuntu-26.04
        type: choice
        options: [ubuntu-24.04, ubuntu-26.04, ubuntu-latest]
      publish:
        description: 'Publish a GitHub release (disable for a canary)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-linux
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version and dependencies
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      build: ${{ steps.r.outputs.build }}
      electron: ${{ steps.r.outputs.electron }}
      upstream_electron: ${{ steps.r.outputs.upstream_electron }}
      upstream_builder: ${{ steps.r.outputs.upstream_builder }}
      builder: ${{ steps.r.outputs.builder }}
      fuses: ${{ steps.r.outputs.fuses }}
      revision: ${{ steps.r.outputs.revision }}
      release_tag: ${{ steps.r.outputs.release_tag }}
      skip: ${{ steps.r.outputs.skip }}
      eol_escape: ${{ steps.r.outputs.eol_escape }}
      fingerprint: ${{ steps.r.outputs.fingerprint }}
      electron_policy: ${{ steps.r.outputs.electron_policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve upstream tag, Electron and previous build
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          ELECTRON_POLICY: ${{ inputs.electron || 'supported' }}
          BUILDER_POLICY: ${{ inputs.builder || 'latest' }}
          FORCE: ${{ inputs.force || 'false' }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/wireapp/wire-desktop/releases?per_page=50" \
              --jq '[.[] | select(.tag_name | startswith("windows/"))][0].tag_name')
          fi
          if ! [[ "$tag" =~ ^windows/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid upstream tag: $tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build="${version##*.}"

          upstream_pkg=$(gh api "repos/wireapp/wire-desktop/contents/package.json?ref=$tag" --jq '.content' | base64 -d)
          upstream_electron=$(jq -r '.devDependencies.electron' <<<"$upstream_pkg")
          upstream_builder=$(jq -r '.devDependencies["electron-builder"]' <<<"$upstream_pkg")
          upstream_major="${upstream_electron%%.*}"

          registry=$(curl -fsSL https://registry.npmjs.org/electron)
          latest=$(jq -r '.["dist-tags"].latest' <<<"$registry")
          latest_major="${latest%%.*}"
          oldest_supported=$((latest_major - 2))
          target_major="$upstream_major"
          if [ "$target_major" -lt "$oldest_supported" ]; then
            target_major="$oldest_supported"
          fi

          case "$ELECTRON_POLICY" in
            upstream)
              target_electron="$upstream_electron"
              ;;
            latest)
              target_major="$latest_major"
              target_electron=$(jq -r --arg t "${target_major}-x-y" '.["dist-tags"][$t] // empty' <<<"$registry")
              ;;
            supported)
              target_electron=$(jq -r --arg t "${target_major}-x-y" '.["dist-tags"][$t] // empty' <<<"$registry")
              ;;
            *)
              echo "Unknown electron policy: $ELECTRON_POLICY" >&2
              exit 1
              ;;
          esac

          if [ -z "$target_electron" ] || [ "$target_electron" = "null" ]; then
            target_electron=$(jq -r --arg p "${target_major}." \
              '[.versions | keys[] | select(startswith($p)) | select(test("-") | not)] | sort_by(split(".") | map(tonumber)) | last' \
              <<<"$registry")
          fi
          if [ -z "$target_electron" ] || [ "$target_electron" = "null" ]; then
            echo "Could not resolve an Electron version for major $target_major" >&2
            exit 1
          fi

          if [ "$BUILDER_POLICY" = "upstream" ]; then
            target_builder="$upstream_builder"
          else
            target_builder=$(curl -fsSL https://registry.npmjs.org/electron-builder | jq -r '.["dist-tags"].latest')
          fi
          # Keep upstream's fuses version: 2.x uses an exports map that upstream's
          # `moduleResolution: node` typecheck cannot resolve. 1.8.x supports the
          # fuse wire and exposes getCurrentFuseWire.
          target_fuses=$(jq -r '.devDependencies["@electron/fuses"]' <<<"$upstream_pkg")

          fingerprint=$(find tools patches -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)

          previous_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          previous_upstream=""
          previous_electron=""
          previous_fingerprint=""
          previous_revision=0
          if [ -n "$previous_tag" ]; then
            tmp=$(mktemp -d)
            if gh release download "$previous_tag" --pattern build-info.json --dir "$tmp" >/dev/null 2>&1; then
              previous_upstream=$(jq -r '.upstream_tag // empty' "$tmp/build-info.json")
              previous_electron=$(jq -r '.electron // empty' "$tmp/build-info.json")
              previous_fingerprint=$(jq -r '.fingerprint // empty' "$tmp/build-info.json")
              previous_revision=$(jq -r '.revision // 0' "$tmp/build-info.json")
            fi
            rm -rf "$tmp"
          fi

          skip=false
          revision=0
          if [ "$previous_upstream" = "$tag" ]; then
            if [ "$previous_electron" = "$target_electron" ] && \
               [ "$previous_fingerprint" = "$fingerprint" ] && \
               [ "$FORCE" != "true" ]; then
              skip=true
            else
              revision=$((previous_revision + 1))
            fi
          fi
          if [ "$PUBLISH_INPUT" = "false" ]; then
            # Canary run: never skip and never publish.
            skip=false
          fi
          release_tag="v${version}"
          if [ "$revision" -gt 0 ]; then
            release_tag="v${version}-r${revision}"
          fi
          eol_escape=false
          if [ "$target_major" != "$upstream_major" ]; then
            eol_escape=true
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "build=$build"
            echo "electron=$target_electron"
            echo "upstream_electron=$upstream_electron"
            echo "upstream_builder=$upstream_builder"
            echo "builder=$target_builder"
            echo "fuses=$target_fuses"
            echo "revision=$revision"
            echo "release_tag=$release_tag"
            echo "skip=$skip"
            echo "eol_escape=$eol_escape"
            echo "fingerprint=$fingerprint"
            echo "electron_policy=$ELECTRON_POLICY"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Resolve"
            echo "- Upstream: \`$tag\`"
            echo "- App version: \`$version\`"
            echo "- Electron: \`$target_electron\` (upstream pin: \`$upstream_electron\`, policy: \`$ELECTRON_POLICY\`)"
            echo "- electron-builder: \`$target_builder\` (upstream pin: \`$upstream_builder\`)"
            echo "- Release: \`$release_tag\` (revision $revision)"
            echo "- Skip: \`$skip\`; EOL escape: \`$eol_escape\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, test and package
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve.outputs.build }}
      ELECTRON: ${{ needs.resolve.outputs.electron }}
      UPSTREAM_ELECTRON: ${{ needs.resolve.outputs.upstream_electron }}
      UPSTREAM_BUILDER: ${{ needs.resolve.outputs.upstream_builder }}
      BUILDER: ${{ needs.resolve.outputs.builder }}
      FUSES: ${{ needs.resolve.outputs.fuses }}
      REVISION: ${{ needs.resolve.outputs.revision }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      EOL_ESCAPE: ${{ needs.resolve.outputs.eol_escape }}
      FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
      ELECTRON_POLICY: ${{ needs.resolve.outputs.electron_policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils zsync binutils shellcheck

      - name: Clone upstream at the release tag
        run: |
          set -euo pipefail
          git clone --branch "$TAG" https://github.com/wireapp/wire-desktop.git src
          git -C src rev-parse HEAD > src/.upstream-commit

      - name: Apply Linux runtime patch (best effort)
        id: runtime
        run: |
          set -euo pipefail
          if git -C src apply --3way "$GITHUB_WORKSPACE/patches/01-linux-runtime.patch"; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
            echo "Linux runtime patch applied."
          else
            git -C src reset --hard HEAD
            git -C src clean -fd
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Linux runtime patch did not apply; building upstream Linux behaviour."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/.node-version

      - name: Enable corepack
        run: corepack enable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/.yarn/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-${{ needs.resolve.outputs.electron }}-${{ hashFiles('src/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ needs.resolve.outputs.electron }}-

      - name: Override dependency versions
        run: |
          set -euo pipefail
          cd src
          yarn up "electron@$ELECTRON" "electron-builder@$BUILDER" "@electron/fuses@$FUSES"
          yarn install --immutable
          installed=$(node -p "require('./node_modules/electron/package.json').version")
          if [ "$installed" != "$ELECTRON" ]; then
            echo "Installed Electron $installed, expected $ELECTRON" >&2
            exit 1
          fi
          echo "electron=$installed" >> "$GITHUB_STEP_SUMMARY"

      - name: Copy build tooling and desktop resources
        run: |
          cp -r "$GITHUB_WORKSPACE/tools" src/tools
          mkdir -p src/resources
          cp "$GITHUB_WORKSPACE/resources/io.github.nichu42.WireDesktop.metainfo.xml" src/resources/
          cp "$GITHUB_WORKSPACE/resources/apparmor.profile" src/resources/

      - name: Lint scripts
        run: |
          shellcheck install.sh tools/release-notes.sh tools/smoke-test.sh
          for file in tools/*.mjs; do node --check "src/$file"; done

      - uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          level: error
          fail_level: error

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          inputs: |
            .github/workflows/build-linux.yml
            .github/workflows/lint.yml
            .github/workflows/scorecard.yml
            .github/workflows/keepalive.yml
            .github/workflows/runner-freshness.yml
            .github/dependabot.yml

      - name: Run upstream test suite
        working-directory: src
        run: |
          set -euo pipefail
          if ! xvfb-run -a yarn test; then
            echo "::warning::upstream test suite failed; retrying once for known UI-test flakes"
            xvfb-run -a yarn test
          fi

      - name: Stamp production configuration
        working-directory: src
        run: node tools/stamp-config.mjs

      - name: Build AppImage (latest electron-builder, fallback upstream)
        working-directory: src
        run: |
          set -euo pipefail
          sed -i "s/@VERSION@/$VERSION/g; s/@DATE@/$(date -u +%F)/g" \
            resources/io.github.nichu42.WireDesktop.metainfo.xml
          yarn build:prepare

          revision_suffix="$REVISION"
          if [ "$revision_suffix" = "0" ]; then
            revision_suffix=""
          fi
          build_appimage() {
            RELEASE_REVISION="$revision_suffix" \
              yarn electron-builder --linux AppImage --x64 --config tools/electron-builder.config.cjs
          }

          if ! build_appimage; then
            current_builder=$(node -p "require('electron-builder/package.json').version")
            echo "::warning::electron-builder $current_builder failed; retrying with upstream $UPSTREAM_BUILDER"
            yarn up "electron-builder@$UPSTREAM_BUILDER"
            yarn install --immutable
            rm -rf wrap/dist
            build_appimage
          fi

      - name: Embed Gear Lever update information
        working-directory: src
        run: |
          set -euo pipefail
          appimage=$(find wrap/dist -maxdepth 1 -name '*.AppImage' -print -quit)
          chmod +x "$appimage"
          node tools/embed-updateinfo.mjs "$appimage" \
            'gh-releases-zsync|nichu42|wire-desktop-linux|latest|Wire-*x86_64.AppImage.zsync'

      - name: Create zsync and release assets
        working-directory: src
        run: |
          set -euo pipefail
          appimage=$(find wrap/dist -maxdepth 1 -name '*.AppImage' -print -quit)
          zsyncmake -u "$(basename "$appimage")" -o "${appimage}.zsync" "$appimage"
          sha1=$(sha1sum "$appimage" | cut -d' ' -f1)
          grep -q "^SHA-1: $sha1$" "${appimage}.zsync" || {
            echo "zsync SHA-1 mismatch" >&2
            exit 1
          }

          cp resources/icons/256x256.png wrap/dist/wire-desktop.png
          cp resources/io.github.nichu42.WireDesktop.metainfo.xml wrap/dist/wire-desktop.metainfo.xml
          cp resources/apparmor.profile wrap/dist/apparmor.profile

          previous_upstream=$(git describe --tags --abbrev=0 --match 'windows/*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$previous_upstream" ]; then
            git log --oneline --no-merges "$previous_upstream..$TAG" > wrap/dist/changelog.txt
          else
            echo "Initial Linux build." > wrap/dist/changelog.txt
          fi

          cd wrap/dist
          sha256sum ./*.AppImage ./*.zsync ./wire-desktop.png \
            ./wire-desktop.metainfo.xml ./apparmor.profile > SHA256SUMS

      - name: Assert artifact contents, update info and zsync
        working-directory: src
        run: |
          set -euo pipefail
          appimage=$(find wrap/dist -maxdepth 1 -name '*.AppImage' -print -quit)
          rm -rf squashfs-root
          "$appimage" --appimage-extract >/dev/null
          node tools/assert-artifact.mjs squashfs-root "$VERSION" "$ELECTRON" "$appimage"

      - name: Runtime smoke test (Ubuntu 24.04)
        working-directory: src
        run: xvfb-run -a bash tools/smoke-test.sh squashfs-root

      - name: Write build-info.json
        working-directory: src
        env:
          RUNTIME_APPLIED: ${{ steps.runtime.outputs.applied }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          commit=$(cat .upstream-commit)
          lock_hash=$(sha256sum yarn.lock | cut -d' ' -f1)
          jq -n \
            --arg schema "1" \
            --arg upstream_tag "$TAG" \
            --arg upstream_commit "$commit" \
            --arg version "$VERSION" \
            --arg release_tag "$RELEASE_TAG" \
            --arg electron "$ELECTRON" \
            --arg upstream_electron "$UPSTREAM_ELECTRON" \
            --arg electron_builder "$(node -p "require('electron-builder/package.json').version")" \
            --arg electron_fuses "$FUSES" \
            --arg revision "$REVISION" \
            --arg fingerprint "$FINGERPRINT" \
            --arg runtime_patch "$RUNTIME_APPLIED" \
            --arg yarn_lock_sha256 "$lock_hash" \
            --arg electron_policy "$ELECTRON_POLICY" \
            --arg eol_escape "$EOL_ESCAPE" \
            --arg built_at "$(date -u +%FT%TZ)" \
            --arg run_id "$RUN_ID" \
            '{
              schema: ($schema | tonumber),
              upstream_tag: $upstream_tag,
              upstream_commit: $upstream_commit,
              version: $version,
              release_tag: $release_tag,
              electron: $electron,
              upstream_electron: $upstream_electron,
              electron_builder: $electron_builder,
              electron_fuses: $electron_fuses,
              revision: ($revision | tonumber),
              fingerprint: $fingerprint,
              runtime_patch: ($runtime_patch == "true"),
              yarn_lock_sha256: $yarn_lock_sha256,
              electron_policy: $electron_policy,
              eol_escape: ($eol_escape == "true"),
              built_at: $built_at,
              run_id: $run_id
            }' > wrap/dist/build-info.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          if-no-files-found: error
          retention-days: 1
          path: |
            src/wrap/dist/*.AppImage
            src/wrap/dist/*.zsync
            src/wrap/dist/wire-desktop.png
            src/wrap/dist/wire-desktop.metainfo.xml
            src/wrap/dist/apparmor.profile
            src/wrap/dist/SHA256SUMS
            src/wrap/dist/build-info.json
            src/wrap/dist/changelog.txt

  smoke-2204:
    name: Startup smoke test (Ubuntu 22.04 / glibc 2.35)
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: artifacts

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils

      - name: Launch the AppImage and wait for app.wire.com
        run: |
          set -euo pipefail
          appimage=$(find artifacts -maxdepth 1 -name '*.AppImage' -print -quit)
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          xvfb-run -a bash tools/smoke-test.sh squashfs-root
          echo "Ubuntu 22.04 startup smoke test passed."

  publish:
    name: Publish release
    needs: [resolve, build, smoke-2204]
    if: ${{ needs.resolve.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish != false) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/*.AppImage'

      - name: Create draft release
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          BUILD_INFO=artifacts/build-info.json \
            CHANGELOG_FILE=artifacts/changelog.txt \
            REPO="$GH_REPO" \
            bash tools/release-notes.sh > notes.md
          gh release create "$RELEASE_TAG" \
            artifacts/*.AppImage \
            artifacts/*.zsync \
            artifacts/wire-desktop.png \
            artifacts/wire-desktop.metainfo.xml \
            artifacts/apparmor.profile \
            artifacts/SHA256SUMS \
            artifacts/build-info.json \
            --draft \
            --title "Wire $VERSION — Linux AppImage (unofficial)" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      - name: Verify draft assets
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          gh release download "$RELEASE_TAG" --dir "$tmp"
          cd "$tmp"
          sha256sum -c SHA256SUMS
          appimage=$(find . -maxdepth 1 -name '*.AppImage' -print -quit)
          chmod +x "$appimage"
          update_info=$("$appimage" --appimage-updateinfo | tr -d '\r')
          expected='gh-releases-zsync|nichu42|wire-desktop-linux|latest|Wire-*x86_64.AppImage.zsync'
          if [ "$update_info" != "$expected" ]; then
            echo "Unexpected update info: $update_info" >&2
            exit 1
          fi
          zsync=$(find . -maxdepth 1 -name '*.zsync' -print -quit)
          sha1=$(sha1sum "$appimage" | cut -d' ' -f1)
          grep -qa "^SHA-1: $sha1$" "$zsync"
          echo "Draft assets verified."

      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Delete draft on failure
        if: failure()
        run: gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true

  report-failure:
    name: Report build failure
    needs: [resolve, build, smoke-2204, publish]
    if: ${{ failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == false)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag || 'unknown' }}
      ELECTRON: ${{ needs.resolve.outputs.electron || 'unknown' }}
      BUILD_RESULT: ${{ needs.build.result }}
      SMOKE_RESULT: ${{ needs.smoke-2204.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      KIND: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish == false) && 'Canary' || 'Scheduled' }}
    steps:
      - name: Open or update a deduplicated failure issue
        run: |
          set -euo pipefail
          gh label create build-failure \
            --color B60205 \
            --description "Scheduled or canary Linux build failure" >/dev/null 2>&1 || true
          title="$KIND build failure: $TAG"
          body=$(cat <<EOF
          $KIND build failed.

          - Run: $RUN_URL
          - Upstream tag: $TAG
          - Electron target: $ELECTRON
          - build: $BUILD_RESULT
          - smoke-2204: $SMOKE_RESULT
          - publish: $PUBLISH_RESULT
          EOF
          )
          existing=$(gh issue list --label build-failure --state open --json number,title \
            | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label build-failure
          fi

  report-success:
    name: Close failure issues after a successful build
    needs: [publish]
    if: success() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Close open build-failure issues
        run: |
          set -euo pipefail
          gh issue list --label build-failure --state open --json number --jq '.[].number' \
            | while read -r number; do
                gh issue close "$number" --comment "Build succeeded: $RUN_URL"
              done
