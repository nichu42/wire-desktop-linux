name: Lint

on:
  push:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          level: error
          fail_level: error

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          inputs: |
            .github/workflows/build-linux.yml
            .github/workflows/flatpak.yml
            .github/workflows/lint.yml
            .github/workflows/scorecard.yml
            .github/workflows/keepalive.yml
            .github/workflows/runner-freshness.yml
            .github/dependabot.yml

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck install.sh tools/release-notes.sh tools/smoke-test.sh \
            tools/flatpak-prepare.sh tools/flatpak-repo.sh tools/flatpak-keygen.sh \
            tools/smoke-test-flatpak.sh flatpak/wire-desktop-flatpak.sh

      - name: Node syntax
        run: |
          for file in tools/*.mjs; do
            node --check "$file"
          done
          node --check flatpak/electron-builder.config.cjs
